<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>华文智能互动学习阅读器</title>
    <style>
        /* ==========================================================================
           🎨 现代华文学习平台全局样式 - 双栏分屏框架版（含纤细美观滚动条优化）
           ========================================================================== */

        :root {
            --bg-color: linear-gradient(135deg, #f4f7f6 0%, #eaefed 100%);
            --text-color: #2c3e50;
            --card-bg: #ffffff;
            --primary-color: #34495e;
            --accent-color: #2ecc71;
            --ai-color: #9b59b6;
            --ruby-color: #e67e22;
            --input-border: #cbd5e1;
            --shadow-sm: 0 2px 8px rgba(0,0,0,0.04);
            --shadow-md: 0 10px 25px rgba(44, 62, 80, 0.05);
        }

        /* 🌙 暗黑模式适配 */
        [data-theme="dark"] {
            --bg-color: linear-gradient(135deg, #141414 0%, #202020 100%);
            --text-color: #e0e0e0;
            --card-bg: #222222;
            --primary-color: #bdc3c7;
            --input-border: #475569;
            --shadow-sm: 0 2px 8px rgba(0,0,0,0.2);
            --shadow-md: 0 10px 25px rgba(0,0,0,0.3);
        }

        /* 🌟 滚动条美化：纤细、现代、悬停加深（日间与暗黑模式双色适配） */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 3px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }
        [data-theme="dark"] ::-webkit-scrollbar-thumb {
            background: #475569;
        }
        [data-theme="dark"] ::-webkit-scrollbar-thumb:hover {
            background: #64748b;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans CJK SC", "Microsoft YaHei", sans-serif;
            background: var(--bg-color);
            background-attachment: fixed;
            color: var(--text-color);
            line-height: 1.8;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            transition: background 0.3s, color 0.3s;
        }

        /* 顶栏控制区 */
        .top-container {
            width: 100%;
            max-width: 1400px;
            margin-bottom: 20px;
        }

        .control-panel {
            display: flex;
            gap: 12px;
            margin-bottom: 15px;
        }

        .control-panel button {
            padding: 10px 20px;
            border: 1px solid rgba(0,0,0,0.05);
            background: var(--card-bg);
            color: var(--text-color);
            border-radius: 24px;
            cursor: pointer;
            font-weight: 600;
            font-size: 14px;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: var(--shadow-sm);
        }

        .control-panel button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 12px rgba(44, 62, 80, 0.08);
        }

        /* 生词本 */
        .vocab-notebook {
            width: 100%;
            background: var(--card-bg);
            padding: 15px 20px;
            border-radius: 16px;
            box-shadow: var(--shadow-md);
            box-sizing: border-box;
            border: 1px solid rgba(0,0,0,0.02);
        }

        .notebook-title {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: bold;
            font-size: 15px;
            margin-bottom: 10px;
            color: var(--text-color);
        }

        .clear-btn {
            background: #e74c3c;
            color: white;
            border: none;
            padding: 4px 12px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 12px;
            font-weight: bold;
            transition: opacity 0.2s;
        }

        .clear-btn:hover { opacity: 0.9; }

        .notebook-list {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .notebook-item {
            background: rgba(52, 152, 219, 0.08);
            color: #2980b9;
            padding: 4px 14px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
        }

        [data-theme="dark"] .notebook-item {
            background: rgba(52, 152, 219, 0.2);
            color: #3498db;
        }

        .notebook-item:hover {
            background: #3498db;
            color: white;
            transform: scale(1.05);
        }

        /* 🖥️ 左右双栏核心工作区 */
        .workspace-layout {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            width: 100%;
            max-width: 1400px;
            align-items: start;
        }

        /* 生词测试游戏区 */
        .game-container {
            width: 100%;
            max-width: 1400px;
            background: var(--card-bg);
            padding: 25px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(142, 68, 173, 0.05);
            margin-bottom: 20px;
            box-sizing: border-box;
            border: 1px solid rgba(0, 0, 0, 0.02);
        }

        .quiz-card { text-align: center; padding: 10px 0; }
        .quiz-pinyin { font-size: 16px; color: #7f8c8d; margin-bottom: 25px; }
        .quiz-options { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
        .quiz-opt-btn {
            padding: 14px 20px;
            background: var(--bg-color);
            border: 1px solid var(--input-border);
            color: var(--text-color);
            border-radius: 10px;
            font-size: 15px;
            cursor: pointer;
            text-align: left;
            transition: all 0.2s;
        }
        .quiz-opt-btn:hover {
            background: #f0f7fc !important;      
            border-color: #3498db !important;     
            color: #2980b9 !important;             
            box-shadow: 0 4px 12px rgba(52, 152, 219, 0.1) !important; 
            transform: translateY(-1px);
        }
        .quiz-opt-btn.correct { background: #2ecc71 !important; color: white !important; border-color: #2ecc71; }
        .quiz-opt-btn.wrong { background: #e74c3c !important; color: white !important; border-color: #e74c3c; cursor: not-allowed; }

        #quizQuestion {
            font-size: 36px;
            font-weight: bold;
            color: #2c3e50 !important;
            letter-spacing: 2px;
        }
        [data-theme="dark"] #quizQuestion { color: #ffffff !important; }

        /* 左侧课文卡片 */
        .article-card {
            width: 100%;
            background: var(--card-bg);
            padding: 35px 40px;
            border-radius: 20px;
            box-shadow: var(--shadow-md);
            box-sizing: border-box;
            border: 1px solid rgba(0,0,0,0.01);
            max-height: 82vh;
            overflow-y: auto;
        }

        /* 右侧题目卡片 */
        .quiz-side-card {
            width: 100%;
            background: var(--card-bg);
            padding: 35px 40px;
            border-radius: 20px;
            box-shadow: var(--shadow-md);
            box-sizing: border-box;
            border: 1px solid rgba(0,0,0,0.01);
            max-height: 82vh;
            overflow-y: auto;
            display: none;
        }

        h1 { text-align: center; font-size: 28px; font-weight: 800; margin-top: 0; margin-bottom: 30px; letter-spacing: 2px; }
        #content p { text-align: justify; text-justify: inter-ideograph; margin-bottom: 30px; font-size: 18px; letter-spacing: 1.2px; }

        .p-index {
            display: inline-block;
            font-size: 12px;
            background: #eef3f0;
            color: #2c3e50;
            padding: 3px 8px;
            border-radius: 6px;
            font-weight: 600;
            user-select: none;
            border: 1px solid #d2ded7;
        }
        [data-theme="dark"] .p-index { background: #2d3748; color: #a0aec0; border-color: #4a5568; }

        ruby { ruby-position: over; cursor: pointer; padding: 0 2px; border-radius: 4px; transition: all 0.2s ease; }
        ruby:hover, ruby.is-active { background: #fff3cd; color: #d35400; }
        [data-theme="dark"] ruby:hover, [data-theme="dark"] ruby.is-active { background: #4a3716; color: #f39c12; }

        #content rt {
            opacity: 0;
            transition: opacity 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            user-select: none;
            font-size: 12px;
            color: var(--ruby-color);
            padding-bottom: 5px;
        }
        #content ruby:hover rt, #content ruby.is-active rt { opacity: 1; }

        /* 气泡弹窗 */
        .buddy-popover {
            display: none;
            position: fixed;
            z-index: 9999;
            background: var(--card-bg);
            color: var(--text-color);
            border-radius: 14px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.12);
            padding: 18px;
            width: 270px;
            box-sizing: border-box;
            border: 1px solid var(--input-border);
        }
        .pop-title-row { display: flex; align-items: baseline; gap: 8px; margin-bottom: 12px; border-bottom: 1px solid var(--input-border); padding-bottom: 8px; }
        .pop-title { font-size: 22px; font-weight: bold; }
        .pop-pinyin { font-size: 14px; color: #e67e22; font-weight: 600; }
        .pop-box { display: flex; gap: 8px; align-items: flex-start; font-size: 14px; margin-bottom: 10px; line-height: 1.5; }
        .pop-tag { font-size: 11px; font-weight: bold; color: white; padding: 2px 5px; border-radius: 4px; flex-shrink: 0; }
        .pop-en { color: #2980b9; } .pop-en .pop-tag { background: #3498db; }
        .pop-bm { color: #c0392b; } .pop-bm .pop-tag { background: #e74c3c; }
        .pop-footer { display: flex; justify-content: flex-end; margin-top: 14px; padding-top: 10px; border-top: 1px solid var(--input-border); }
        .pop-btn-copy { background: #2ecc71; color: white; border: none; padding: 6px 16px; border-radius: 8px; font-size: 13px; cursor: pointer; font-weight: bold; }
        .pop-arrow { position: absolute; bottom: -8px; left: 50%; width: 0; height: 0; border-left: 8px solid transparent; border-right: 8px solid transparent; border-top: 8px solid var(--card-bg); transform: translateX(-50%); }

        /* 选择题按钮状态 */
        .quiz-choice-btn { background: #ffffff !important; color: #2c3e50 !important; border: 1px solid #cbd5e1 !important; transition: all 0.15s ease !important; }
        .quiz-choice-btn.selected { background: #f0f8ff !important; border: 2px solid #2980b9 !important; color: #2980b9 !important; font-weight: 700 !important; }
        .quiz-choice-btn.correct-answer-hint { background: #f4fbf7 !important; border: 2px solid #2ecc71 !important; color: #27ae60 !important; font-weight: 700 !important; }

        [data-theme="dark"] .quiz-choice-btn { background: #2d2d2d !important; color: #e0e0e0 !important; border: 1px solid #475569 !important; }
        [data-theme="dark"] .quiz-choice-btn.selected { background: #1a252f !important; border: 2px solid #3498db !important; color: #5dade2 !important; font-weight: 700 !important; }
        [data-theme="dark"] .quiz-choice-btn.correct-answer-hint { background: #1e2d24 !important; border: 2px solid #2ecc71 !important; color: #58d68d !important; font-weight: 700 !important; }

        /* 简答题文本框样式 */
        .essay-textarea {
            width: 100%;
            height: 80px;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid var(--input-border);
            background: var(--bg-color);
            color: var(--text-color);
            font-family: inherit;
            font-size: 14px;
            resize: vertical;
            box-sizing: border-box;
            margin-top: 8px;
        }
        .essay-textarea:focus {
            outline: none;
            border-color: #3498db;
            box-shadow: 0 0 5px rgba(52, 152, 219, 0.2);
        }

        /* 简答题参考答案容器 */
        .essay-answer-box {
            display: none;
            margin-top: 10px;
            padding: 12px;
            background: #eef9f2;
            border-left: 4px solid #2ecc71;
            border-radius: 4px;
            font-size: 13.5px;
            color: #1e8449;
            line-height: 1.6;
        }
        [data-theme="dark"] .essay-answer-box {
            background: #192e22;
            color: #58d68d;
        }

        /* 赏析高亮块 */
        .teacher-p-analysis, [id^="q-analysis-"], [id^="essay-analysis-"] { background: #faf5ff !important; border-left: 3px solid #af7ac5 !important; color: #6c3483 !important; }
        #teacherArticleAnalysis { background: #f3e5f5 !important; border-left: 4px solid #9b59b6 !important; color: #4a148c !important; }
        [data-theme='dark'] #teacherArticleAnalysis { background: #251833 !important; border-left: 4px solid #bb86fc !important; color: #e1bee7 !important; }
        [data-theme='dark'] .teacher-p-analysis, [data-theme='dark'] [id^="q-analysis-"], [data-theme='dark'] [id^="essay-analysis-"] { background: #1d1226 !important; border-left: 3px solid #a278b5 !important; color: #d7bde2 !important; }

        @media (max-width: 1024px) {
            .workspace-layout { grid-template-columns: 1fr; }
            .article-card, .quiz-side-card { max-height: none; }
        }
    </style>
</head>
<body>

    <!-- 顶栏操作区 -->
    <div class="top-container">
        <div class="control-panel">
            <button id="themeToggleBtn" onclick="toggleTheme()">🌓 切换主题</button>
            <button id="gameToggleBtn" onclick="toggleGameMode()">🎯 生词测试</button>
            <button id="teacherToggleBtn" onclick="toggleTeacherMode()" style="background: #9b59b6; color: white;">👁️ 文本赏析</button>
        </div>

        <div class="vocab-notebook">
            <div class="notebook-title">
                <span>📖 我的生词本</span>
                <button class="clear-btn" onclick="forceClearNotebook()">清空本子 🗑️</button>
            </div>
            <div id="notebookList" class="notebook-list"></div>
        </div>
    </div>

    <!-- 生词测试全屏浮层 -->
    <div id="gameContainer" class="game-container" style="display: none;">
        <div class="quiz-card">
            <div id="quizProgress" style="font-size: 14px; color: #7f8c8d; margin-bottom: 5px;"></div>
            <div id="quizQuestion" class="quiz-question"></div>
            <div id="quizPinyin" class="quiz-pinyin"></div>
            <div id="quizOptions" class="quiz-options"></div>
        </div>
    </div>

    <!-- 左右双栏主工作区 -->
    <div class="workspace-layout">
        <!-- 左侧：课文与总览赏析 -->
        <div class="article-card">
            <h1 id="articleTitle">课文加载中...</h1>
            <div id="teacherArticleAnalysis" style="display: none; padding: 15px; margin-bottom: 20px; border-radius: 4px; font-size: 14px; position: relative;">
                <div id="teacherArticleAnalysisContent"></div>
            </div>
            <div id="content"></div>
        </div>

        <!-- 右侧：客观题及简答题区 -->
        <div id="quizSection" class="quiz-side-card">
            <!-- 一、选择题部分 -->
            <h2 style="font-size: 20px; margin-bottom: 20px; border-bottom: 2px dashed #bdc3c7; padding-bottom: 10px;">📝 一、选择题（客观题）</h2>
            <div id="quizContainer"></div>

            <!-- 客观题提交与结果展示区 -->
            <div style="margin-top: 25px; padding-top: 15px; border-top: 2px solid #eaefed; text-align: center;">
                <button id="submitQuizBtn" onclick="submitAndShowWrongOnly()" style="padding: 12px 30px; background: #34495e; color: white; border: none; border-radius: 25px; font-size: 15px; font-weight: bold; cursor: pointer;">
                    提交客观题检查 🚀
                </button>
                <button id="retryQuizBtn" onclick="retryQuizAnswers()" style="display: none; padding: 12px 30px; background: #e67e22; color: white; border: none; border-radius: 25px; font-size: 15px; font-weight: bold; cursor: pointer; margin-right: 10px;">
                    重新作答 🔄
                </button>
                <button id="showCorrectBtn" onclick="revealRealCorrectAnswers()" style="display: none; padding: 12px 30px; background: #2ecc71; color: white; border: none; border-radius: 25px; font-size: 15px; font-weight: bold; cursor: pointer;">
                    查看客观题答案 👁️
                </button>
                <div id="quizResultScore" style="margin-top: 15px; font-size: 16px; font-weight: bold; color: #2ecc71; display: none; line-height: 1.6;"></div>
            </div>

            <!-- 二、简答题部分（带有 LocalStorage 自动保存草稿功能） -->
            <div style="margin-top: 40px; padding-top: 25px; border-top: 3px solid #dfe6e9;">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; border-bottom: 2px dashed #bdc3c7; padding-bottom: 10px;">
                    <h2 style="font-size: 20px; margin: 0; color: #2c3e50;">✍️ 二、简答题（主观题）</h2>
                    <button onclick="clearEssayDrafts()" style="background: #e74c3c; color: white; border: none; padding: 4px 10px; border-radius: 12px; font-size: 11px; cursor: pointer;" title="清空所有简答题输入草稿">清空简答草稿 🗑️</button>
                </div>
                <div id="essayContainer"></div>
            </div>
        </div>
    </div>

    <!-- 词典气泡弹窗 -->
    <div id="buddyPopover" class="buddy-popover">
        <div class="pop-title-row">
            <span id="popWord" class="pop-title">词</span>
            <span id="popPinyin" class="pop-pinyin">[pīn yīn]</span>
        </div>
        <div class="pop-box pop-en"><span class="pop-tag">EN</span><span id="popEn"></span></div>
        <div class="pop-box pop-bm"><span class="pop-tag">BM</span><span id="popBm"></span></div>
        <div class="pop-footer"><button class="pop-btn-copy" onclick="saveToNotebook(event)">Copy 📋</button></div>
        <div id="popArrow" class="pop-arrow"></div>
    </div>

    <!-- 🔗 外部独立数据挂载文件 -->
    <script src="data.js"></script>
    <script src="questions.js"></script>
    <script src="analysis.js"></script>

    <!-- ⚙️ 阅读器核心逻辑控制大脑 -->
    <script>
        let currentIdx = -1; 
        let saved = JSON.parse(localStorage.getItem('saved_104')) || [];
        let quizData = [];
        let currentQuizIdx = 0;
        let isLocked = false;
        let isTeacherMode = false;
        let userSelectedAnswers = {};

        window.onload = function() {
            if (typeof lessonTitle !== 'undefined') {
                document.getElementById('articleTitle').innerText = lessonTitle;
                document.title = lessonTitle;
            }

            if (typeof lessonData !== 'undefined') { 
                render(); 
                renderNB(); 
            }

            renderMultipleChoiceQuizzes();
            renderEssayQuizzes();
            
            document.body.appendChild(document.getElementById('buddyPopover'));
            document.addEventListener('click', () => { 
                document.getElementById('buddyPopover').style.display = 'none'; 
                document.querySelectorAll('ruby').forEach(r => r.classList.remove('is-active'));
            });
        };

        function render() {
            const cnt = document.getElementById('content'); 
            if (!cnt) return;
            cnt.innerHTML = "";
            let pNum = 1; 
            let p = document.createElement("p"); 
            
            const topAnalysis = document.getElementById('teacherArticleAnalysis');
            const topAnalysisContent = document.getElementById('teacherArticleAnalysisContent');
            if (topAnalysis && topAnalysisContent) {
                if (isTeacherMode && typeof lessonTeacherAnalysis !== 'undefined' && lessonTeacherAnalysis.overview) {
                    topAnalysis.style.display = "block";
                    topAnalysisContent.innerHTML = `<strong>💡 课文总览与赏析要点：</strong><br>${lessonTeacherAnalysis.overview}`;
                } else {
                    topAnalysis.style.display = "none";
                }
            }

            function finalizeParagraph(paragraphElement) {
                if (paragraphElement.childNodes.length === 0) return;
                const textContent = paragraphElement.innerText.trim();
                const isAuthorLineAtEnd = (textContent.startsWith("（") && textContent.includes("《"));
                
                if (isAuthorLineAtEnd) {
                    paragraphElement.style.textIndent = "0";
                    paragraphElement.style.textAlign = "right";  
                    paragraphElement.style.color = "#7f8c8d";    
                    paragraphElement.style.fontSize = "15px";     
                    paragraphElement.style.marginTop = "30px";    
                    cnt.appendChild(paragraphElement);
                } else {
                    paragraphElement.style.position = "relative";
                    paragraphElement.style.textIndent = "2em"; 
                    paragraphElement.style.paddingLeft = "0"; 
                    paragraphElement.style.marginBottom = "15px";
                    
                    let s = document.createElement("span");
                    s.className = "p-index";
                    s.innerText = "第" + pNum + "段";
                    s.style.position = "absolute";
                    s.style.left = "-50px"; 
                    s.style.top = "4px"; 
                    s.style.textIndent = "0"; 
                    
                    paragraphElement.insertBefore(s, paragraphElement.firstChild); 
                    cnt.appendChild(paragraphElement);

                    if (typeof lessonTeacherAnalysis !== 'undefined' && lessonTeacherAnalysis.paragraphs && lessonTeacherAnalysis.paragraphs[pNum]) {
                        let pAnalysis = document.createElement("div");
                        pAnalysis.id = `p-analysis-${pNum}`;
                        pAnalysis.className = "teacher-p-analysis";
                        pAnalysis.style.padding = "10px 15px"; 
                        pAnalysis.style.margin = "5px 0 20px 0";
                        pAnalysis.style.fontSize = "13px";
                        pAnalysis.style.borderRadius = "4px";
                        pAnalysis.style.textIndent = "0";
                        pAnalysis.innerHTML = `<strong>🔍 第 ${pNum} 段文本赏析：</strong>${lessonTeacherAnalysis.paragraphs[pNum]}`;
                        
                        pAnalysis.style.display = isTeacherMode ? "block" : "none";
                        cnt.appendChild(pAnalysis);
                    }
                    pNum++; 
                }
            }

            if (typeof lessonData !== 'undefined') {
                lessonData.forEach((d, i) => {
                    if (d[0] === "\n") { finalizeParagraph(p); p = document.createElement("p"); }
                    else if (d[1] === "") { let s = document.createElement("span"); s.innerText = d[0]; p.appendChild(s); }
                    else {
                        let r = document.createElement("ruby"); 
                        r.setAttribute("data-word-index", i);
                        r.onclick = (e) => { 
                            e.stopPropagation(); 
                            document.querySelectorAll('ruby').forEach(x=>x.classList.remove('is-active')); 
                            r.classList.add('is-active'); 
                            openPop(e.currentTarget, i);
                        };
                        r.innerHTML = `${d[0]}<rt>${d[1]}</rt>`; 
                        p.appendChild(r);
                    }
                });
                finalizeParagraph(p);
            }
        }

        function renderMultipleChoiceQuizzes() {
            const section = document.getElementById('quizSection');
            const container = document.getElementById('quizContainer');
            if (!container) return;
            section.style.display = "block";
            container.innerHTML = "";
            
            if (typeof quizDataList === 'undefined' || quizDataList.length === 0) {
                container.innerHTML = "<p style='color:#7f8c8d;'>暂无选择题数据</p>";
                return;
            }

            userSelectedAnswers = {};
            document.getElementById('quizResultScore').style.display = "none";
            document.getElementById('submitQuizBtn').style.display = "inline-block";
            document.getElementById('submitQuizBtn').disabled = false;
            document.getElementById('submitQuizBtn').innerText = "提交客观题检查 🚀";
            document.getElementById('retryQuizBtn').style.display = "none";
            document.getElementById('showCorrectBtn').style.display = "none";

            quizDataList.forEach((q) => {
                const qBox = document.createElement('div');
                qBox.style.marginBottom = "20px";
                qBox.style.paddingBottom = "15px";
                qBox.style.borderBottom = "1px dashed #ddd";
                qBox.setAttribute("data-q-id", q.id);

                const qText = document.createElement('div');
                qText.style.fontWeight = "bold";
                qText.style.fontSize = "15px";
                qText.style.marginBottom = "8px";
                qText.innerHTML = `${q.id}. ${q.question.replace(/\n/g, '<br>')}`;
                qBox.appendChild(qText);

                if (q.teacherAnalysis) {
                    let qAnalysis = document.createElement("div");
                    qAnalysis.id = `q-analysis-${q.id}`;
                    qAnalysis.style.padding = "8px 12px";
                    qAnalysis.style.marginBottom = "10px";
                    qAnalysis.style.fontSize = "12.5px";
                    qAnalysis.style.borderRadius = "4px";
                    qAnalysis.innerHTML = `<strong>📐 设题意图与核心考点：</strong>${q.teacherAnalysis}`;
                    qAnalysis.style.display = isTeacherMode ? "block" : "none";
                    qBox.appendChild(qAnalysis);
                }

                const oBox = document.createElement('div');
                oBox.className = "options-group";
                
                let pureContents = q.options.map(opt => opt.replace(/^[A-D]\s+/, ""));
                let shuffledContents = [...pureContents].sort(() => Math.random() - 0.5);
                const prefixes = ["A", "B", "C", "D"];

                shuffledContents.forEach((content, index) => {
                    const prefix = prefixes[index];
                    const finalOptText = `${prefix} ${content}`;
                    const btn = document.createElement('button');
                    btn.innerText = finalOptText;
                    btn.className = "quiz-choice-btn";
                    
                    const originalMatch = q.options.find(o => o.replace(/^[A-D]\s+/, "") === content);
                    btn.setAttribute("data-original-text", originalMatch || finalOptText);

                    btn.style.display = "block";
                    btn.style.width = "100%";
                    btn.style.textAlign = "left";
                    btn.style.margin = "5px 0";
                    btn.style.padding = "9px 12px";
                    btn.style.borderRadius = "6px";
                    btn.style.cursor = "pointer";
                    btn.style.fontSize = "13.5px";

                    btn.onclick = () => {
                        if (btn.disabled) return;
                        Array.from(oBox.children).forEach(b => b.classList.remove('selected'));
                        btn.classList.add('selected');
                        userSelectedAnswers[q.id] = originalMatch || finalOptText;
                    };
                    oBox.appendChild(btn);
                });

                qBox.appendChild(oBox);
                container.appendChild(qBox);
            });
        }

        function renderEssayQuizzes() {
            const container = document.getElementById('essayContainer');
            if (!container) return;
            container.innerHTML = "";

            if (typeof essayDataList === 'undefined' || essayDataList.length === 0) {
                container.innerHTML = "<p style='color:#7f8c8d; font-size:13px;'>暂无简答题数据</p>";
                return;
            }

            essayDataList.forEach((essay) => {
                const eBox = document.createElement('div');
                eBox.style.marginBottom = "25px";
                eBox.style.paddingBottom = "15px";
                eBox.style.borderBottom = "1px dashed #ddd";
                eBox.setAttribute("data-essay-id", essay.id);

                const eText = document.createElement('div');
                eText.style.fontWeight = "bold";
                eText.style.fontSize = "15px";
                eText.style.marginBottom = "8px";
                eText.innerHTML = `${essay.question}`;
                eBox.appendChild(eText);

                if (essay.teacherAnalysis) {
                    let eAnalysis = document.createElement("div");
                    eAnalysis.id = `essay-analysis-${essay.id}`;
                    eAnalysis.className = "teacher-p-analysis";
                    eAnalysis.style.padding = "8px 12px";
                    eAnalysis.style.marginBottom = "10px";
                    eAnalysis.style.fontSize = "12.5px";
                    eAnalysis.style.borderRadius = "4px";
                    eAnalysis.innerHTML = `<strong>📐 考点与答题思路：</strong>${essay.teacherAnalysis}`;
                    eAnalysis.style.display = isTeacherMode ? "block" : "none";
                    eBox.appendChild(eAnalysis);
                }

                const textarea = document.createElement('textarea');
                textarea.className = "essay-textarea";
                textarea.placeholder = "请在此输入您的解答思路（内容将自动实时保存在本地浏览器中）...";
                
                const storageKey = `essay_draft_${essay.id}`;
                const savedDraft = localStorage.getItem(storageKey);
                if (savedDraft) {
                    textarea.value = savedDraft;
                }

                textarea.oninput = () => {
                    localStorage.setItem(storageKey, textarea.value);
                };

                eBox.appendChild(textarea);

                const toggleAnswerBtn = document.createElement('button');
                toggleAnswerBtn.innerText = "👁️ 查看参考答案";
                toggleAnswerBtn.style.cssText = "margin-top: 8px; padding: 5px 12px; background: #8e44ad; color: white; border: none; border-radius: 15px; font-size: 12px; cursor: pointer;";
                
                const answerBox = document.createElement('div');
                answerBox.className = "essay-answer-box";
                answerBox.innerHTML = `<strong>💡 参考答案：</strong><br>${essay.sampleAnswer}`;

                toggleAnswerBtn.onclick = () => {
                    if (answerBox.style.display === "block") {
                        answerBox.style.display = "none";
                        toggleAnswerBtn.innerText = "👁️ 查看参考答案";
                    } else {
                        answerBox.style.display = "block";
                        toggleAnswerBtn.innerText = "🔒 隐藏参考答案";
                    }
                };

                eBox.appendChild(toggleAnswerBtn);
                eBox.appendChild(answerBox);
                container.appendChild(eBox);
            });
        }

        function clearEssayDrafts() {
            if (confirm("⚠️ 确定要清空所有简答题的本地输入草稿吗？")) {
                if (typeof essayDataList !== 'undefined') {
                    essayDataList.forEach(essay => {
                        localStorage.removeItem(`essay_draft_${essay.id}`);
                    });
                }
                renderEssayQuizzes();
            }
        }

        function toggleTeacherMode() {
            isTeacherMode = !isTeacherMode;
            const btn = document.getElementById('teacherToggleBtn');
            btn.innerText = isTeacherMode ? "❌ 关闭文本赏析" : "👁️ 文本赏析";
            btn.style.background = isTeacherMode ? "#7d3c98" : "#9b59b6";
            
            const topAnalysis = document.getElementById('teacherArticleAnalysis');
            const topAnalysisContent = document.getElementById('teacherArticleAnalysisContent');
            if (topAnalysis && topAnalysisContent) {
                if (isTeacherMode && typeof lessonTeacherAnalysis !== 'undefined' && lessonTeacherAnalysis.overview) {
                    topAnalysis.style.display = "block";
                    topAnalysisContent.innerHTML = `<strong>💡 课文总览与赏析要点：</strong><br>${lessonTeacherAnalysis.overview}`;
                } else {
                    topAnalysis.style.display = "none";
                }
            }

            document.querySelectorAll('.teacher-p-analysis').forEach(panel => {
                panel.style.display = isTeacherMode ? "block" : "none";
            });

            if (typeof quizDataList !== 'undefined') {
                quizDataList.forEach(q => {
                    const qPanel = document.getElementById(`q-analysis-${q.id}`);
                    if (qPanel) qPanel.style.display = isTeacherMode ? "block" : "none";
                });
            }

            if (typeof essayDataList !== 'undefined') {
                essayDataList.forEach(e => {
                    const ePanel = document.getElementById(`essay-analysis-${e.id}`);
                    if (ePanel) ePanel.style.display = isTeacherMode ? "block" : "none";
                });
            }
        }

        function submitAndShowWrongOnly() {
            const totalQuestions = quizDataList.length;
            const answeredCount = Object.keys(userSelectedAnswers).length;

            if (answeredCount < totalQuestions) {
                alert(`⚠️ 客观选择题还有未填完的哦！已完成 (${answeredCount} / ${totalQuestions}) 题。`);
                return;
            }

            let score = 0;
            quizDataList.forEach(q => {
                const qBox = document.querySelector(`div[data-q-id="${q.id}"]`);
                const buttons = qBox.querySelectorAll('.quiz-choice-btn');
                const studentOriginalText = userSelectedAnswers[q.id];

                let selectedBtn = null;
                buttons.forEach(btn => {
                    if (btn.getAttribute("data-original-text") === studentOriginalText) selectedBtn = btn;
                });

                const studentLetter = studentOriginalText.trim().charAt(0);
                buttons.forEach(btn => {
                    btn.disabled = true; 
                    btn.style.boxShadow = "none";

                    if (btn === selectedBtn && studentLetter === q.answer) {
                        if (!btn.innerText.includes("  (✅)")) btn.innerText += "  (✅)";
                        btn.classList.add('correct-answer-hint');
                        btn.style.fontWeight = "bold";
                    }
                    if (btn === selectedBtn && studentLetter !== q.answer) {
                        btn.style.background = "#e74c3c";
                        btn.style.color = "white";
                        btn.style.borderColor = "#e74c3c";
                        if (!btn.innerText.includes("  (❌️)")) btn.innerText += "  (❌️)";
                    }
                });

                if (studentLetter === q.answer) score++;
            });

            const resultBox = document.getElementById('quizResultScore');
            resultBox.style.display = "block";
            resultBox.innerHTML = `🎉 客观题得分：<span style="font-size: 20px; color: #e67e22;">${score}</span> / ${totalQuestions} 分`;
            
            document.getElementById('submitQuizBtn').style.display = "none";
            document.getElementById('retryQuizBtn').style.display = "inline-block";
            document.getElementById('showCorrectBtn').style.display = "inline-block";
        }

        function retryQuizAnswers() {
            renderMultipleChoiceQuizzes();
            renderEssayQuizzes();
            document.getElementById('quizResultScore').style.display = "none";
            document.getElementById('retryQuizBtn').style.display = "none";
            document.getElementById('showCorrectBtn').style.display = "none";
            document.getElementById('submitQuizBtn').style.display = "inline-block";
        }

        function revealRealCorrectAnswers() {
            quizDataList.forEach(q => {
                const qBox = document.querySelector(`div[data-q-id="${q.id}"]`);
                qBox.querySelectorAll('.quiz-choice-btn').forEach(btn => {
                    const btnOriginalText = btn.getAttribute("data-original-text");
                    const btnLetter = btnOriginalText ? btnOriginalText.trim().charAt(0) : btn.innerText.trim().charAt(0); 

                    if (btnLetter === q.answer) {
                        let currentText = btn.innerText.replace("  (✅)", "").replace(" (✅)", "");
                        btn.innerText = currentText + "  (✅)";
                        btn.style.fontWeight = "bold";
                        btn.classList.add('correct-answer-hint');
                    }
                });
            });
            document.getElementById('showCorrectBtn').style.display = "none";
        }

        function openPop(el, i) {
            currentIdx = i; const d = lessonData[i];
            document.getElementById('popWord').innerText = d[0];
            document.getElementById('popPinyin').innerText = `[${d[1]}]`;
            document.getElementById('popEn').innerText = d[2]; 
            document.getElementById('popBm').innerText = d[3];
            
            const pop = document.getElementById('buddyPopover'); 
            const arrow = document.getElementById('popArrow');
            pop.style.display = 'block'; 
            
            const rect = el.getBoundingClientRect(); 
            const popRect = pop.getBoundingClientRect();
            
            let top = rect.top - popRect.height - 15; 
            let left = rect.left + (rect.width / 2) - (popRect.width / 2);
            
            if (left + popRect.width > window.innerWidth - 15) left = window.innerWidth - popRect.width - 15;
            if (left < 15) left = 15;
            
            arrow.style.left = `${(rect.left + rect.width / 2) - left}px`; 
            pop.style.top = `${top}px`; 
            pop.style.left = `${left}px`;
        }

        function saveToNotebook(e) { 
            e.stopPropagation(); 
            if (!saved.includes(currentIdx)) { 
                saved.push(currentIdx); 
                localStorage.setItem('saved_104', JSON.stringify(saved)); 
                renderNB(); 
            } 
            const btn = e.target; 
            btn.innerText = "✓ 已存"; 
            setTimeout(() => btn.innerText = "Copy 📋", 1000); 
        }

        function renderNB() { 
            const list = document.getElementById('notebookList'); 
            if (!list) return;
            if (saved.length === 0) { 
                list.innerHTML = "<span style='color:#999; font-size:13px;'>点击正文词语 Copy 记录生词</span>"; 
            } else { 
                list.innerHTML = ""; 
                saved.forEach(idx => { 
                    const item = lessonData[idx]; 
                    if(!item) return; 
                    
                    const div = document.createElement("div"); 
                    div.className = "notebook-item"; 
                    div.style.display = "inline-flex";
                    div.style.alignItems = "center";
                    div.style.gap = "6px";
                    div.style.cursor = "pointer";

                    const textSpan = document.createElement("span");
                    textSpan.innerText = item[0];
                    textSpan.onclick = (e) => { 
                        e.stopPropagation(); 
                        const target = document.querySelector(`ruby[data-word-index="${idx}"]`); 
                        if(target) { 
                            target.scrollIntoView({behavior: "smooth", block: "center"}); 
                            document.querySelectorAll('ruby').forEach(r => r.classList.remove('is-active')); 
                            setTimeout(() => { 
                                target.classList.add('is-active'); 
                                openPop(target, idx); 
                            }, 500); 
                        } 
                    }; 
                    div.appendChild(textSpan);

                    const deleteBtn = document.createElement("span");
                    deleteBtn.innerText = "×";
                    deleteBtn.style.color = "#e74c3c";
                    deleteBtn.style.fontWeight = "bold";
                    deleteBtn.style.padding = "0 2px";
                    deleteBtn.style.cursor = "pointer";
                    deleteBtn.style.borderRadius = "50%";
                    deleteBtn.onmouseenter = () => { deleteBtn.style.background = "#fce4e4"; };
                    deleteBtn.onmouseleave = () => { deleteBtn.style.background = "transparent"; };
                    deleteBtn.onclick = (e) => { e.stopPropagation(); removeSingleWordFromNotebook(idx); };
                    div.appendChild(deleteBtn);

                    list.appendChild(div); 
                }); 
            } 
        }

        function removeSingleWordFromNotebook(idx) {
            saved = saved.filter(savedIdx => savedIdx !== idx);
            localStorage.setItem('saved_104', JSON.stringify(saved)); 
            renderNB(); 
            if (saved.length === 0) {
                document.getElementById('gameContainer').style.display = 'none'; 
                document.getElementById('gameToggleBtn').innerText = "🎯 生词测试";
            }
        }

        function forceClearNotebook() { 
            localStorage.removeItem('saved_104'); 
            saved = []; 
            renderNB(); 
            document.getElementById('gameContainer').style.display = 'none'; 
            document.getElementById('gameToggleBtn').innerText = "🎯 生词测试"; 
        }

        function toggleGameMode() { 
            const container = document.getElementById('gameContainer'); 
            const btn = document.getElementById('gameToggleBtn'); 
            if (container.style.display === 'block') { 
                container.style.display = 'none'; 
                btn.innerText = "🎯 生词测试"; 
            } else { 
                if (saved.length < 1) { 
                    alert("生词本是空的哦！要先在正文里点生词进行 Copy 收集！"); 
                    return; 
                } 
                container.style.display = 'block'; 
                btn.innerText = "📖 返回课文"; 
                startQuizGame(); 
                container.scrollIntoView({behavior: "smooth"}); 
            } 
        }

        function startQuizGame() { 
            quizData = [...saved].sort(() => Math.random() - 0.5); 
            currentQuizIdx = 0; 
            loadQuestion(); 
        }

        function loadQuestion() { 
            isLocked = false; 
            const targetIdx = quizData[currentQuizIdx]; 
            const data = lessonData[targetIdx]; 
            document.getElementById('quizProgress').innerText = `第 ${currentQuizIdx + 1} / ${quizData.length} 题`; 
            document.getElementById('quizQuestion').innerText = data[0]; 
            document.getElementById('quizPinyin').innerText = `[${data[1]}]`; 
            
            const correctStr = (data[2].trim() + "；" + data[3].trim()); 
            let options = [correctStr]; 
            let others = lessonData.filter(d => d[1] !== "" && d[0] !== data[0]).map(d => (d[2].trim() + "；" + d[3].trim())); 
            others = [...new Set(others)].filter(s => s !== correctStr).sort(() => Math.random() - 0.5); 
            
            for(let i=0; i<3; i++) { if(others[i]) options.push(others[i]); } 
            options.sort(() => Math.random() - 0.5); 
            
            const optDiv = document.getElementById('quizOptions'); 
            optDiv.innerHTML = ""; 
            options.forEach(opt => { 
                const b = document.createElement('button'); 
                b.className = 'quiz-opt-btn'; 
                b.innerText = opt; 
                b.onclick = () => { 
                    if(isLocked || b.classList.contains('wrong')) return; 
                    if(opt.trim() === correctStr.trim()) { 
                        isLocked = true; 
                        b.classList.add('correct'); 
                        setTimeout(() => { 
                            currentQuizIdx++; 
                            if(currentQuizIdx < quizData.length) loadQuestion(); 
                            else { alert("🎉 完成测试！你真棒！"); toggleGameMode(); } 
                        }, 800); 
                    } else { b.classList.add('wrong'); } 
                }; 
                optDiv.appendChild(b); 
            }); 
        }

        function toggleTheme() { 
            document.documentElement.setAttribute('data-theme', document.documentElement.getAttribute('data-theme')==='dark'?'':'dark'); 
        }
    </script>
</body>
</html>
